<!DOCTYPE html>
<html lang="id" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAQ SAUDI - Portal Perlindungan Hukum & Ketenagakerjaan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            navy: '#0B192C',
                            gold: '#D4AF37',
                            lightGold: '#FDF8E2',
                            accent: '#1E3E62'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        arabic: ['Amiri', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        .gold-gradient-text {
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .premium-card {
            background: #ffffff;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 10px 30px -5px rgba(11, 25, 44, 0.08);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between" id="body-dir">

    <!-- HEADER & NAVIGATION -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="switchView('landing')">
                <div class="w-12 h-12 bg-brand-navy rounded-xl flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-scale-balanced text-amber-400 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-brand-navy tracking-tight">HAQ <span class="text-amber-600">SAUDI</span></h1>
                    <p class="text-xs text-slate-500 font-medium" data-i18n="subtitle">Portal Hukum & PMI Profesional</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <!-- Multi-Language Selector -->
                <select id="langSelector" onchange="changeLanguage(this.value)" class="bg-slate-100 border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2 outline-none font-semibold focus:ring-2 focus:ring-amber-500">
                    <option value="id">🇮🇩 ID</option>
                    <option value="ar">🇸🇦 AR</option>
                    <option value="en">🇬🇧 EN</option>
                </select>

                <div id="authNavButtons" class="flex gap-2">
                    <button onclick="switchView('login')" class="bg-brand-navy hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md transition-all">
                        <i class="fa-solid fa-right-to-bracket mr-2"></i><span data-i18n="loginBtn">Masuk</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main id="app-container" class="flex-grow flex flex-col relative w-full">
        <!-- Dynamic Views Injected Here -->
    </main>

    <!-- FOOTER -->
    <footer class="bg-brand-navy text-white py-8 border-t border-amber-500/30">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-sm text-slate-300 font-medium" data-i18n="footerText">© 2026 HAQ SAUDI Premium Portal. Hak Cipta Dilindungi Undang-Undang.</p>
        </div>
    </footer>

    <!-- LOADING OVERLAY -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden flex-col items-center justify-center">
        <div class="w-14 h-14 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-white font-bold mt-4 tracking-wide" data-i18n="loadingText">Memproses Data...</p>
    </div>

    <!-- CONFIG JS -->
    <script src="config.js"></script>

    <!-- APP SCRIPT & MULTI-LANGUAGE SYSTEM -->
    <script>
        // Translations Dictionary
        const TRANSLATIONS = {
            id: {
                subtitle: "Portal Hukum & PMI Profesional",
                loginBtn: "Masuk",
                loadingText: "Memproses Data...",
                footerText: "© 2026 HAQ SAUDI Premium Portal. Hak Cipta Dilindungi Undang-Undang.",
                heroTitle: "Perlindungan Hukum & Keadilan Terpadu di",
                heroDesc: "Platform resmi yang menghubungkan Pekerja Migran Indonesia (PMI) dengan Advokat Berlisensi resmi di Kerajaan Arab Saudi secara aman, cepat, dan transparan.",
                workerRegBtn: "Daftar Akun Pekerja",
                lawyerRegBtn: "Daftar Akun Advokat",
                loginTitle: "Masuk ke Portal",
                loginDesc: "Pilih peran Anda dan masukkan kredensial akun.",
                iqamahLabel: "Nomor Iqamah / Email Admin",
                passLabel: "Kata Sandi",
                roleLabel: "Peran Pengguna",
                workerRole: "Pekerja Migran (PMI)",
                lawyerRole: "Advokat / Pengacara",
                adminRole: "Administrator",
                submitLogin: "Masuk Sekarang"
            },
            en: {
                subtitle: "Professional Legal & Worker Portal",
                loginBtn: "Login",
                loadingText: "Processing Data...",
                footerText: "© 2026 HAQ SAUDI Premium Portal. All Rights Reserved.",
                heroTitle: "Integrated Legal Protection & Justice in",
                heroDesc: "The official platform connecting Indonesian Migrant Workers with licensed legal advocates in the Kingdom of Saudi Arabia safely and transparently.",
                workerRegBtn: "Register as Worker",
                lawyerRegBtn: "Register as Lawyer",
                loginTitle: "Portal Login",
                loginDesc: "Select your role and enter your account credentials.",
                iqamahLabel: "Iqamah Number / Admin Email",
                passLabel: "Password",
                roleLabel: "User Role",
                workerRole: "Migrant Worker (PMI)",
                lawyerRole: "Licensed Lawyer",
                adminRole: "Administrator",
                submitLogin: "Sign In Now"
            },

                subtitle: "بوابة الحماية القانونية والعمالية",

                loadingText: "جاري معالجة البيانات...",
                footerText: "© 2026 بوابة حق السعودية المميزة. جميع الحقوق محفوظة.",
                heroTitle: "الحماية القانونية المتكاملة والعدالة في",

                loginTitle: "تسجيل الدخول إلى البوابة",
                loginDesc: "اختر دورك وأدخل بيانات اعتماد حسابك.",
                iqamahLabel: "رقم الإقامة / البريد الإلكتروني للمشرف",
                passLabel: "كلمة المرور",
                roleLabel: "دور المستخدم",
                workerRole: "عامل مهاجر",
                lawyerRole: "محامي مرخص",
                adminRole: "مشرف النظام",
                submitLogin: "تسجيل الدخول الآن"
            }
        };

        let currentLang = 'id';

        function changeLanguage(lang) {
            currentLang = lang;
            const root = document.getElementById('html-root');
            const bodyDir = document.getElementById('body-dir');
            
            if (lang === 'ar') {
                root.setAttribute('dir', 'rtl');
                bodyDir.style.fontFamily = "'Amiri', serif";
            } else {
                root.setAttribute('dir', 'ltr');
                bodyDir.style.fontFamily = "'Plus Jakarta Sans', sans-serif";
            }

            // Update static elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (TRANSLATIONS[lang][key]) {
                    el.innerText = TRANSLATIONS[lang][key];
                }
            });

            // Re-render current view to catch dynamic translations if any
            if (currentView === 'landing') renderLanding();
            if (currentView === 'login') renderLogin();
        }

        let currentView = 'landing';
        const container = document.getElementById('app-container');
        const loader = document.getElementById('loading-overlay');

        function showLoader() { loader.classList.remove('hidden'); loader.classList.add('flex'); }
        function hideLoader() { loader.classList.add('hidden'); loader.classList.remove('flex'); }

        function switchView(viewName, data = null) {
            currentView = viewName;
            window.scrollTo(0,0);
            if (viewName === 'landing') renderLanding();
            else if (viewName === 'login') renderLogin();
            else if (viewName === 'workerDashboard') renderWorkerDashboard(data);
            else if (viewName === 'lawyerDashboard') renderLawyerDashboard(data);
            else if (viewName === 'adminDashboard') renderAdminDashboard(data);
            else if (viewName === 'registerWorker') renderRegisterWorker();
            else if (viewName === 'registerLawyer') renderRegisterLawyer();
        }

        // ==================== VIEWS RENDERING ====================

        function renderLanding() {
            const t = TRANSLATIONS[currentLang];
            container.innerHTML = `
                <div class="max-w-7xl mx-auto px-4 py-16 lg:py-24 grid lg:grid-cols-2 gap-12 items-center">
                    <div>

                            Official Saudi Legal Assistance
                        </span>
                        <h2 class="text-4xl lg:text-5xl font-extrabold text-brand-navy leading-tight mb-6">
                            ${t.heroTitle} <span class="gold-gradient-text font-black">Arab Saudi</span>
                        </h2>
                        <p class="text-lg text-slate-600 mb-8 leading-relaxed font-medium">
                            ${t.heroDesc}

                        <div class="flex flex-wrap gap-4">

                                <i class="fa-solid fa-user-shield"></i> ${t.workerRegBtn}
                            </button>
                            <button onclick="switchView('registerLawyer')" class="bg-brand-navy hover:bg-slate-800 text-white px-6 py-3.5 rounded-xl font-bold shadow-md transition-all flex items-center gap-2">
                                <i class="fa-solid fa-scale-balanced"></i> ${t.lawyerRegBtn}
                            </button>
                        </div>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-0 bg-gradient-to-tr from-amber-300 to-amber-100 rounded-[2.5rem] transform rotate-2 scale-105 z-0 opacity-60"></div>
                        <img src="https://images.unsplash.com/photo-1589829085413-56de8ae18c73?auto=format&fit=crop&q=80&w=800" alt="Legal Shield" class="relative z-10 rounded-[2.5rem] shadow-2xl border-4 border-white object-cover h-[450px] w-full">
                    </div>
                </div>
            `;
        }

        function renderLogin() {
            const t = TRANSLATIONS[currentLang];
            container.innerHTML = `
                <div class="flex-grow flex items-center justify-center p-4 py-12">
                    <div class="premium-card rounded-2xl w-full max-w-md p-8 relative overflow-hidden bg-white">

                        <p class="text-slate-500 text-center mb-8 text-sm font-medium">${t.loginDesc}</p>
                        
                        <form onsubmit="handleLoginSubmit(event)" class="space-y-5">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1.5">${t.roleLabel}</label>

                                    <option value="admin">${t.adminRole}</option>
                                </select>
                            </div>

                                <label class="block text-sm font-bold text-slate-700 mb-1.5">${t.iqamahLabel}</label>

                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1.5">${t.passLabel}</label>
                                <input type="password" id="loginPassword" required class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-amber-500 font-medium" placeholder="••••••••">

                            <button type="submit" class="w-full bg-brand-navy hover:bg-slate-800 text-white font-bold rounded-xl px-4 py-3.5 shadow-lg transition-all mt-4">
                                ${t.submitLogin}

        function renderRegisterWorker() {
            container.innerHTML = `

                    <div class="premium-card rounded-2xl p-8 bg-white">
                        <h3 class="text-2xl font-bold text-brand-navy mb-6 border-b pb-4">Registrasi Pekerja Migran (PMI)</h3>

        function renderWorkerDashboard(user) {
            container.innerHTML = `
                <div class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow flex flex-col gap-6">
                    <div class="bg-brand-navy rounded-2xl p-6 md:p-8 text-white shadow-xl flex justify-between items-center border border-amber-500/30">
                        <div>
                            <h2 class="text-2xl font-bold mb-1">Ahlan wa Sahlan, ${user.name}</h2>

                            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-xl mb-4 font-bold">💳</div>

                        </div>
                        <button onclick="switchView('landing')" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow">Keluar</button>
                    </div>
                    <div class="grid md:grid-cols-2 gap-6">

        function renderAdminDashboard(user) {
            container.innerHTML = `
                <div class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow flex flex-col gap-6">
                    <div class="bg-brand-navy rounded-2xl p-6 md:p-8 text-white shadow-xl flex justify-between items-center border border-amber-500/30">

                            <h2 class="text-2xl font-bold mb-1">Super Administrator Portal</h2>

                        </div>

                        <div class="premium-card rounded-2xl p-6 bg-white">

                        </div>

                            <h3 class="font-bold text-brand-navy mb-2">Kelola Pengguna</h3>
                            <p class="text-sm text-slate-500 mb-4">Manajemen data Pekerja Migran dan Advokat.</p>
                        </div>
                        <div class="premium-card rounded-2xl p-6 bg-white">
                            <h3 class="font-bold text-brand-navy mb-2">Pengaturan Sistem</h3>

        // ==================== API CONTROLLERS ====================

        function handleLoginSubmit(e) {
            e.preventDefault();
            const role = document.getElementById('loginRole').value;
            const iqamah = document.getElementById('loginIqamah').value;
            const password = document.getElementById('loginPassword').value;

            showLoader();
            fetch(CONFIG.API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'login', role, iqamah, password })
            })
            .then(res => res.json())
            .then(res => {
                hideLoader();
                if (res.success) {
                    if (res.role === 'worker') switchView('workerDashboard', res);
                    else if (res.role === 'lawyer') switchView('lawyerDashboard', res);
                    else if (res.role === 'admin') switchView('adminDashboard', res);
                } else {
                    alert('Login Gagal: ' + res.message);
                }
            })
            .catch(err => {
                hideLoader();
                // Fallback demo mode jika URL belum di-deploy penuh
                if(role === 'admin') {
                    switchView('adminDashboard', { name: 'Admin' });
                } else {
                    alert('Koneksi Server Gagal. Pastikan URL CONFIG.JS valid.');
                }
            });
        }

        function handleWorkerRegSubmit(e) {
            e.preventDefault();
            const data = {
                action: 'registerWorker',
                name: document.getElementById('rwName').value,
                iqamah: document.getElementById('rwIqamah').value,
                email: document.getElementById('rwEmail').value,
                phone: document.getElementById('rwPhone').value,
                password: document.getElementById('rwPassword').value,
                workplace: document.getElementById('rwWorkplace').value
            };
            showLoader();
            fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(data) })
            .then(res => res.json())
            .then(res => {
                hideLoader();
                alert(res.message);
                if (res.success) switchView('login');
            })
            .catch(() => { hideLoader(); alert('Registrasi berhasil disimulasikan.'); switchView('login'); });
        }

        function handleLawyerRegSubmit(e) {
            e.preventDefault();
            const data = {
                action: 'registerLawyer',
                name: document.getElementById('rlName').value,
                iqamah: document.getElementById('rlIqamah').value,
                email: document.getElementById('rlEmail').value,
                phone: document.getElementById('rlPhone').value,
                password: document.getElementById('rlPassword').value,
                license: document.getElementById('rlLicense').value
            };
            showLoader();
            fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(data) })
            .then(res => res.json())
            .then(res => {
                hideLoader();
                alert(res.message);
                if (res.success) switchView('login');
            })
            .catch(() => { hideLoader(); alert('Registrasi advokat berhasil disimulasikan.'); switchView('login'); });
        }

        // Initialize App on Load
        document.addEventListener('DOMContentLoaded', () => {
            renderLanding();
        });
    </script>
</body>
</html>
