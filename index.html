<!DOCTYPE html>
<html lang="id" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAQ SAUDI - Portal Perlindungan Hukum & Ketenagakerjaan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { navy: '#0B192C', gold: '#D4AF37', accent: '#1E3E62' } },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], arabic: ['Amiri', 'serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between" id="body-dir">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="switchView('landing')">
                <div class="w-12 h-12 bg-brand-navy rounded-xl flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-scale-balanced text-amber-400 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-brand-navy tracking-tight">HAQ <span class="text-amber-600">SAUDI</span></h1>
                    <p class="text-xs text-slate-500 font-medium">Portal Hukum & PMI Profesional</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <select id="langSelector" onchange="changeLanguage(this.value)" class="bg-slate-100 border text-sm rounded-lg px-3 py-2 font-semibold">
                    <option value="id">🇮🇩 ID</option>
                    <option value="ar">🇸🇦 AR</option>
                    <option value="en">🇬🇧 EN</option>
                </select>
                <button onclick="switchView('login')" class="bg-brand-navy text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i>Masuk
                </button>
            </div>
        </div>
    </header>

    <main id="app-container" class="flex-grow flex flex-col relative w-full"></main>

    <footer class="bg-brand-navy text-white py-6 border-t border-amber-500/30 text-center text-sm">
        <p>© 2026 HAQ SAUDI Premium Portal. Hak Cipta Dilindungi.</p>
    </footer>

    <div id="loading-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden flex-col items-center justify-center">
        <div class="w-14 h-14 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-white font-bold mt-4">Memproses Data...</p>
    </div>

    <script src="config.js"></script>
    <script>
        let currentLang = 'id';
        let currentUser = null;

        function showLoader() { document.getElementById('loading-overlay').classList.remove('hidden'); document.getElementById('loading-overlay').classList.add('flex'); }
        function hideLoader() { document.getElementById('loading-overlay').classList.add('hidden'); document.getElementById('loading-overlay').classList.remove('flex'); }

        function switchView(viewName, data = null) {
            window.scrollTo(0,0);
            const container = document.getElementById('app-container');
            if(viewName === 'landing') renderLanding(container);
            else if(viewName === 'login') renderLogin(container);
            else if(viewName === 'workerDashboard') renderWorkerDashboard(container, data);
            else if(viewName === 'lawyerDashboard') renderLawyerDashboard(container, data);
            else if(viewName === 'adminDashboard') renderAdminDashboard(container, data);
            else if(viewName === 'consultation') renderConsultation(container, data);
        }

        function renderLanding(container) {
            container.innerHTML = `
                <div class="max-w-7xl mx-auto px-4 py-20 grid lg:grid-cols-2 gap-12 items-center">
                    <div>
                        <span class="px-4 py-1.5 rounded-full bg-amber-100 text-amber-800 text-xs font-extrabold uppercase mb-6 inline-block">Official Saudi Legal Assistance</span>
                        <h2 class="text-4xl lg:text-5xl font-extrabold text-brand-navy leading-tight mb-6">
                            Perlindungan Hukum & Keadilan Terpadu di <span class="text-amber-600">Arab Saudi</span>
                        </h2>
                        <p class="text-lg text-slate-600 mb-8 font-medium">Terhubung langsung dengan Advokat resmi berlisensi, fitur terjemahan otomatis bahasa Arab-Indonesia, dan konsultasi aman.</p>
                        <button onclick="switchView('login')" class="bg-amber-500 hover:bg-amber-600 text-white px-6 py-3.5 rounded-xl font-bold shadow-lg">Mulai Konsultasi & Layanan</button>
                    </div>
                    <div class="bg-amber-50 p-8 rounded-3xl border border-amber-200">
                        <h3 class="text-xl font-bold text-brand-navy mb-4"><i class="fa-solid fa-circle-info mr-2 text-amber-600"></i>Info Akses Admin</h3>
                        <p class="text-sm text-slate-700 mb-2">Gunakan kredensial berikut untuk masuk sebagai Admin:</p>
                        <div class="bg-white p-4 rounded-xl border text-sm font-mono space-y-1">
                            <p><b>Email:</b> muh.restu5@gmail.com</p>
                            <p><b>Password:</b> admin123</p>
                        </div>
                    </div>
                </div>`;
        }

        function renderLogin(container) {
            container.innerHTML = `
                <div class="flex-grow flex items-center justify-center p-4 py-12">
                    <div class="bg-white rounded-2xl w-full max-w-md p-8 shadow-xl border border-slate-200">
                        <h3 class="text-2xl font-bold text-brand-navy text-center mb-2">Masuk ke Portal</h3>
                        <p class="text-slate-500 text-center mb-8 text-sm">Pilih peran dan masukkan akses akun Anda.</p>
                        <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1">Peran Pengguna</label>
                                <select id="loginRole" class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm font-medium">
                                    <option value="worker">Pekerja Migran (PMI)</option>
                                    <option value="lawyer">Advokat / Pengacara</option>
                                    <option value="admin">Administrator</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1">Nomor Iqamah / Email Admin</label>
                                <input type="text" id="loginIqamah" required class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm" placeholder="Nomor Iqamah atau Email">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1">Kata Sandi</label>
                                <input type="password" id="loginPassword" required class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm" placeholder="••••••••">
                            </div>
                            <button type="submit" class="w-full bg-brand-navy text-white font-bold rounded-xl py-3.5 shadow-lg mt-2">Masuk Sekarang</button>
                        </form>
                    </div>
                </div>`;
        }

        function renderWorkerDashboard(container, user) {
            currentUser = user;
            let expiryWarning = '';
            if (user.daysLeft <= 30 && user.daysLeft > 0) {
                expiryWarning = `<div class="bg-amber-100 border-l-4 border-amber-500 p-4 mb-6 rounded-r-xl text-amber-900 font-semibold text-sm">⚠️ Peringatan: Masa aktif akun Anda akan habis dalam ${user.daysLeft} hari lagi. Segera lakukan perpanjangan pembayaran sebesar 99 SAR/tahun.</div>`;
            } else if (user.isExpired) {
                expiryWarning = `<div class="bg-red-100 border-l-4 border-red-500 p-4 mb-6 rounded-r-xl text-red-900 font-semibold text-sm">❌ Masa aktif akun Anda telah habis. Silakan lakukan pembayaran 99 SAR/tahun untuk membuka kembali fitur penuh.</div>`;
            }

            container.innerHTML = `
                <div class="max-w-5xl mx-auto px-4 py-8 w-full flex flex-col gap-6">
                    ${expiryWarning}
                    <div class="bg-brand-navy rounded-2xl p-6 text-white flex justify-between items-center shadow-lg">
                        <div>
                            <h2 class="text-2xl font-bold">Ahlan, ${user.name}</h2>
                            <p class="text-slate-300 text-sm">Iqamah: ${user.iqamah} | Status Bayar: <b>${user.paymentStatus}</b></p>
                        </div>
                        <button onclick="switchView('landing')" class="bg-red-500 text-white px-4 py-2 rounded-xl text-sm font-bold">Keluar</button>
                    </div>
                    
                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow border">
                            <h3 class="font-bold text-lg mb-2 text-brand-navy">💬 Konsultasi & Pesan Hukum</h3>
                            <p class="text-sm text-slate-500 mb-4">Kirim pesan langsung ke pengacara. Terjemahan otomatis Bahasa Indonesia ke Arab aktif!</p>
                            <button onclick="switchView('consultation', {user: currentUser, partnerId: 'LAW001', partnerName: 'Advokat Abdullah (Lawyer)'})" class="bg-brand-navy text-white px-4 py-2.5 rounded-xl text-sm font-bold">Buka Ruang Pesan</button>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow border">
                            <h3 class="font-bold text-lg mb-2 text-brand-navy">💳 Pembayaran Tahunan (99 SAR)</h3>
                            <p class="text-sm text-slate-500 mb-4">Biaya langganan perlindungan hukum setahun penuh (Manual Transfer).</p>
                            <button onclick="openPaymentModal()" class="bg-amber-500 text-white px-4 py-2.5 rounded-xl text-sm font-bold">Kirim Bukti Bayar 99 SAR</button>
                        </div>
                    </div>
                </div>`;
        }

        function renderLawyerDashboard(container, user) {
            currentUser = user;
            container.innerHTML = `
                <div class="max-w-5xl mx-auto px-4 py-8 w-full flex flex-col gap-6">
                    <div class="bg-brand-navy rounded-2xl p-6 text-white flex justify-between items-center shadow-lg">
                        <div>
                            <h2 class="text-2xl font-bold">Advokat Portal: ${user.name}</h2>
                            <p class="text-amber-400 text-sm">Nomor Lisensi Aktif</p>
                        </div>
                        <button onclick="switchView('landing')" class="bg-red-500 text-white px-4 py-2 rounded-xl text-sm font-bold">Keluar</button>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow border">
                        <h3 class="font-bold text-lg mb-2 text-brand-navy">📥 Kotak Masuk Klien (PMI)</h3>
                        <p class="text-sm text-slate-500 mb-4">Pesan masuk dari pekerja akan otomatis diterjemahkan dari bahasa Indonesia ke Arab.</p>
                        <button onclick="switchView('consultation', {user: currentUser, partnerId: '2xxxxxxxx0', partnerName: 'Pekerja Klien'})" class="bg-brand-navy text-white px-4 py-2.5 rounded-xl text-sm font-bold">Buka Ruang Pesan Klien</button>
                    </div>
                </div>`;
        }

        function renderAdminDashboard(container, user) {
            currentUser = user;
            container.innerHTML = `
                <div class="max-w-6xl mx-auto px-4 py-8 w-full flex flex-col gap-6">
                    <div class="bg-brand-navy rounded-2xl p-6 text-white flex justify-between items-center shadow-lg">
                        <div>
                            <h2 class="text-2xl font-bold">Panel Administrator</h2>
                            <p class="text-amber-400 text-sm">Laporan pembayaran dan manajemen sistem.</p>
                        </div>
                        <button onclick="switchView('landing')" class="bg-red-500 text-white px-4 py-2 rounded-xl text-sm font-bold">Keluar</button>
                    </div>
                    <div id="admin-reports-content" class="bg-white p-6 rounded-2xl shadow border">
                        <p class="text-slate-500">Memuat laporan...</p>
                    </div>
                </div>`;
            loadAdminData();
        }

        function loadAdminData() {
            fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action: 'getAdminReports' }) })
            .then(res => res.json())
            .then(res => {
                let html = `<h3 class="font-bold text-lg text-brand-navy mb-4">Laporan Pembayaran & Langganan 99 SAR</h3>`;
                if(res.payments && res.payments.length > 0) {
                    html += `<div class="overflow-x-auto"><table class="w-full text-left text-sm border-collapse"><thead class="bg-slate-100 border-b"><tr><th class="p-3">Iqamah</th><th class="p-3">Nama</th><th class="p-3">Jumlah</th><th class="p-3">Bukti</th><th class="p-3">Status</th><th class="p-3">Aksi</th></tr></thead><tbody>`;
                    res.payments.forEach(p => {
                        html += `<tr class="border-b"><td class="p-3">${p.iqamah}</td><td class="p-3">${p.name}</td><td class="p-3">${p.amount} SAR</td><td class="p-3"><a href="${p.receipt}" target="_blank" class="text-blue-600 underline">Lihat File</a></td><td class="p-3 font-semibold">${p.status}</td><td class="p-3"><button onclick="verifyPayment('${p.iqamah}', 'approve')" class="bg-emerald-600 text-white px-3 py-1 rounded text-xs font-bold">Setujui</button></td></tr>`;
                    });
                    html += `</tbody></table></div>`;
                } else {
                    html += `<p class="text-slate-500 text-sm">Belum ada data pembayaran masuk.</p>`;
                }
                document.getElementById('admin-reports-content').innerHTML = html;
            });
        }

        function verifyPayment(iqamah, adminAction) {
            showLoader();
            fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action: 'verifyPaymentAdmin', iqamah, adminAction }) })
            .then(res => res.json())
            .then(res => { hideLoader(); alert(res.message); loadAdminData(); });
        }

        function renderConsultation(container, data) {
            const partnerId = data.partnerId;
            const partnerName = data.partnerName;
            const targetLang = currentUser.role === 'worker' ? 'ar' : 'id';

            container.innerHTML = `
                <div class="max-w-4xl mx-auto px-4 py-8 w-full flex flex-col h-[80vh]">
                    <div class="bg-brand-navy text-white p-4 rounded-t-2xl flex justify-between items-center">
                        <h3 class="font-bold">Konsultasi dengan: ${partnerName}</h3>
                        <button onclick="switchView('${currentUser.role}Dashboard', currentUser)" class="text-xs bg-slate-700 px-3 py-1.5 rounded-lg">Kembali</button>
                    </div>
                    <div id="chat-box" class="flex-grow bg-white border-x border-slate-200 p-4 overflow-y-auto space-y-4 flex flex-col">
                        <p class="text-center text-xs text-slate-400">Pesan otomatis diterjemahkan (${currentUser.role === 'worker' ? 'ID ➔ AR' : 'AR ➔ ID'})</p>
                    </div>
                    <div class="bg-slate-100 p-4 rounded-b-2xl border border-slate-200 flex gap-2 items-center">
                        <input type="file" id="chatFile" class="hidden" onchange="uploadChatFile(this)">
                        <button onclick="document.getElementById('chatFile').click()" class="bg-slate-200 hover:bg-slate-300 px-3 py-3 rounded-xl text-slate-700" title="Lampirkan JPG / PDF"><i class="fa-solid fa-paperclip"></i></button>
                        <input type="text" id="chatInput" placeholder="Ketik pesan..." class="flex-grow bg-white border rounded-xl px-4 py-3 text-sm outline-none">
                        <button onclick="sendChatMessage('${partnerId}', '${targetLang}')" class="bg-brand-navy text-white px-6 py-3 rounded-xl font-bold">Kirim</button>
                    </div>
                </div>`;
            fetchMessages(partnerId);
        }

        function fetchMessages(partnerId) {
            fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action: 'getMessages', userIqamah: currentUser.iqamah, partnerIqamah: partnerId }) })
            .then(res => res.json())
            .then(res => {
                const box = document.getElementById('chat-box');
                if(!box) return;
                let html = `<p class="text-center text-xs text-slate-400">Riwayat Percakapan</p>`;
                if(res.chats) {
                    res.chats.forEach(c => {
                        let isMe = c.senderIqamah === currentUser.iqamah;
                        html += `<div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                            <div class="max-w-md p-3 rounded-xl text-sm ${isMe ? 'bg-brand-navy text-white' : 'bg-slate-200 text-slate-900'}">
                                <p>${c.message}</p>
                                <p class="text-xs opacity-75 mt-1 italic">Terjemahan: ${c.translated}</p>
                                ${c.attachment ? `<a href="${c.attachment}" target="_blank" class="block text-xs underline mt-1 text-amber-300">Lihat Lampiran File</a>` : ''}
                            </div>
                        </div>`;
                    });
                }
                box.innerHTML = html;
                box.scrollTop = box.scrollHeight;
            });
        }

        function sendChatMessage(partnerId, targetLang) {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if(!msg) return;

            showLoader();
            fetch(CONFIG.API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'sendMessage',
                    senderIqamah: currentUser.iqamah,
                    senderRole: currentUser.role,
                    receiverIqamah: partnerId,
                    message: msg,
                    targetLang: targetLang,
                    attachmentLink: ''
                })
            }).then(() => {
                hideLoader();
                input.value = '';
                fetchMessages(partnerId);
            });
        }

        function uploadChatFile(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            showLoader();
            reader.onload = function(e) {
                fetch(CONFIG.API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'uploadFile',
                        base64: e.target.result,
                        contentType: file.type,
                        folderName: 'Case Files',
                        fileName: file.name
                    })
                }).then(res => res.json()).then(res => {
                    hideLoader();
                    if(res.success) {
                        // Kirim otomatis sebagai pesan dengan lampiran
                        fetch(CONFIG.API_URL, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'sendMessage',
                                senderIqamah: currentUser.iqamah,
                                senderRole: currentUser.role,
                                receiverIqamah: 'LAW001',
                                message: '[Mengunggah Berkas Lampiran: ' + file.name + ']',
                                targetLang: currentUser.role === 'worker' ? 'ar' : 'id',
                                attachmentLink: res.fileLink
                            })
                        }).then(() => fetchMessages('LAW001'));
                    }
                });
            };
            reader.readAsDataURL(file);
        }

        function openPaymentModal() {
            let receiptUrl = prompt("Masukkan Link Bukti Bayar (Google Drive / Gambar yang sudah di-upload):");
            if(!receiptUrl) return;
            showLoader();
            fetch(CONFIG.API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'submitPayment',
                    iqamah: currentUser.iqamah,
                    name: currentUser.name,
                    receiptLink: receiptUrl
                })
            }).then(res => res.json()).then(res => { hideLoader(); alert(res.message); });
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const role = document.getElementById('loginRole').value;
            const iqamah = document.getElementById('loginIqamah').value;
            const password = document.getElementById('loginPassword').value;

            showLoader();
            fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', role, iqamah, password }) })
            .then(res => res.json())
            .then(res => {
                hideLoader();
                if(res.success) {
                    if(res.role === 'worker') switchView('workerDashboard', res);
                    else if(res.role === 'lawyer') switchView('lawyerDashboard', res);
                    else if(res.role === 'admin') switchView('adminDashboard', res);
                } else { alert(res.message); }
            });
        }

        function changeLanguage(lang) { currentLang = lang; }
        document.addEventListener('DOMContentLoaded', () => switchView('landing', document.getElementById('app-container')));
    </script>
</body>
</html>
