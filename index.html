        function changeSystemLanguage(lang) {
            currentLang = lang;
            const root = document.getElementById('html-root');
            const bodyDir = document.getElementById('body-dir');
            if(lang === 'ar') {
                root.setAttribute('dir', 'rtl');
                root.setAttribute('lang', 'ar');
                bodyDir.style.fontFamily = "'Amiri', serif, 'Plus Jakarta Sans', sans-serif";
            } else {
                root.setAttribute('dir', 'ltr');
                root.setAttribute('lang', lang);
                bodyDir.style.fontFamily = "'Plus Jakarta Sans', sans-serif";
            }
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(i18n[lang][key]) el.innerText = i18n[lang][key];
            });
        }

        function showLoader() { document.getElementById('loading-overlay').classList.remove('hidden'); document.getElementById('loading-overlay').classList.add('flex'); }
        function hideLoader() { document.getElementById('loading-overlay').classList.add('hidden'); document.getElementById('loading-overlay').classList.remove('flex'); }

        function switchView(viewName, data = null) {
            window.scrollTo(0,0);
            const container = document.getElementById('app-container');
            if(viewName === 'landing') renderLanding(container);
            else if(viewName === 'login') renderLogin(container);
            else if(viewName === 'register') renderRegister(container);
            else if(viewName === 'workerDashboard') renderWorkerDashboard(container, data);
            else if(viewName === 'lawyerDashboard') renderLawyerDashboard(container, data);
            else if(viewName === 'adminDashboard') renderAdminDashboard(container, data);
            else if(viewName === 'consultation') renderConsultation(container, data);
            changeSystemLanguage(currentLang);
        }

            container.innerHTML = `

                        Solusi Hukum & Konsultasi PMI Terpadu

                        <button onclick="switchView('register')" class="bg-amber-500 text-white px-8 py-3.5 rounded-xl font-bold shadow-lg" data-i18n="nav_register">Daftar Baru</button>
                    </div>

        }

        // HALAMAN LOGIN

                        <h3 class="text-2xl font-bold text-brand-navy text-center mb-2" data-i18n="login_title">Masuk ke Portal</h3>
                        <p class="text-slate-500 text-center mb-6 text-sm" data-i18n="login_desc">Pilih peran dan masukkan kredensial Anda.</p>
                        <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1" data-i18n="role_worker">Peran Pengguna</label>

                    </div>
                </div>`;
        }

        function toggleRegFields(val) {
            const label = document.querySelector('#extraFieldContainer label');
            const input = document.getElementById('regExtra');
            if(val === 'lawyer') {
                label.setAttribute('data-i18n', 'license_no');
                label.innerText = i18n[currentLang]['license_no'] || "Nomor Lisensi Advokat";
                input.placeholder = "Nomor izin praktik resmi";
            } else {
                label.setAttribute('data-i18n', 'workplace');
                label.innerText = i18n[currentLang]['workplace'] || "Tempat Kerja";
                input.placeholder = "Nama perusahaan / majikan";
            }
        }

        // DASHBOARD WORKER DENGAN EXPIRY WARNING & PEMBAYARAN 99 SAR

            let expiryWarning = '';
            if (user.daysLeft <= 30 && user.daysLeft > 0) {
                expiryWarning = `<div class="bg-amber-100 border-l-4 border-amber-500 p-4 mb-6 rounded-r-xl text-amber-900 font-semibold text-sm">⚠️ Peringatan: Masa aktif akun Anda akan berakhir dalam ${user.daysLeft} hari. Silakan perpanjang pembayaran 99 SAR/tahun.</div>`;
            } else if (user.isExpired) {
                expiryWarning = `<div class="bg-red-100 border-l-4 border-red-500 p-4 mb-6 rounded-r-xl text-red-900 font-semibold text-sm">❌ Masa aktif akun Anda telah habis. Harap lakukan pembayaran 99 SAR/tahun untuk mengaktifkan kembali layanan penuh.</div>`;
            }

            container.innerHTML = `
                <div class="max-w-5xl mx-auto px-4 py-8 w-full flex flex-col gap-6">
                    ${expiryWarning}
                    <div class="bg-brand-navy rounded-2xl p-6 text-white flex justify-between items-center shadow-lg">
                        <div>
                            <h2 class="text-2xl font-bold">Ahlan, ${user.name}</h2>
                            <p class="text-slate-300 text-sm">Iqamah: ${user.iqamah} | Status: <b>${user.paymentStatus}</b> | Sisa Masa Aktif: <b>${user.daysLeft} Hari</b></p>
                        </div>
                        <button onclick="switchView('landing')" class="bg-red-500 text-white px-4 py-2 rounded-xl text-sm font-bold" data-i18n="logout">Keluar</button>
                    </div>

                            <p class="text-sm text-slate-500 mb-4" data-i18n="chat_desc">Kirim pesan dan konsultasi dengan pengacara berlisensi dengan terjemahan 3 bahasa aktif!</p>
                            <button onclick="switchView('consultation', {user: currentUser, partnerId: 'LAW001', partnerName: 'Advokat Abdullah (Lawyer)'})" class="bg-brand-navy text-white px-4 py-2.5 rounded-xl text-sm font-bold" data-i18n="btn_open_chat">Buka Ruang Pesan</button>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow border">
                            <h3 class="font-bold text-lg mb-2 text-brand-navy" data-i18n="payment_title">💳 Pembayaran Tahunan (99 SAR)</h3>
                            <p class="text-sm text-slate-500 mb-4" data-i18n="payment_desc">Biaya langganan perlindungan hukum setahun penuh via transfer manual.</p>
                            <button onclick="openPaymentModal()" class="bg-amber-500 text-white px-4 py-2.5 rounded-xl text-sm font-bold" data-i18n="btn_upload_receipt">Kirim Bukti Bayar 99 SAR</button>

                    </div>
                </div>`;
        }

                            <h2 class="text-2xl font-bold">Panel Administrator</h2>
                            <p class="text-amber-400 text-sm">Laporan pembayaran 99 SAR dan verifikasi langganan.</p>
                        </div>
                        <button onclick="switchView('landing')" class="bg-red-500 text-white px-4 py-2 rounded-xl text-sm font-bold" data-i18n="logout">Keluar</button>
                    </div>
                    <div id="admin-reports-content" class="bg-white p-6 rounded-2xl shadow border">
                        <p class="text-slate-500">Memuat laporan...</p>
                    </div>
                </div>`;
            loadAdminData();
        }

        function loadAdminData() {
            showLoader();
            fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action: 'getAdminReports' }) })
            .then(res => res.json())
            .then(res => {
                hideLoader();
                let html = `<h3 class="font-bold text-lg text-brand-navy mb-4">Laporan Pembayaran Langganan (99 SAR/tahun)</h3>`;
                if(res.payments && res.payments.length > 0) {
                    html += `<div class="overflow-x-auto"><table class="w-full text-left text-sm border-collapse"><thead class="bg-slate-100 border-b"><tr><th class="p-3">Iqamah</th><th class="p-3">Nama</th><th class="p-3">Jumlah</th><th class="p-3">Bukti</th><th class="p-3">Status</th><th class="p-3">Aksi</th></tr></thead><tbody>`;
                    res.payments.forEach(p => {
                        html += `<tr class="border-b"><td class="p-3">${p.iqamah}</td><td class="p-3">${p.name}</td><td class="p-3">${p.amount} SAR</td><td class="p-3"><a href="${p.receipt}" target="_blank" class="text-blue-600 underline font-semibold">Lihat File</a></td><td class="p-3 font-semibold">${p.status}</td><td class="p-3"><button onclick="verifyPayment('${p.iqamah}', 'approve')" class="bg-emerald-600 text-white px-3 py-1 rounded text-xs font-bold">Setujui (+1 Tahun)</button></td></tr>`;
                    });
                    html += `</tbody></table></div>`;
                } else {
                    html += `<p class="text-slate-500 text-sm">Belum ada data pembayaran masuk.</p>`;
                }
                document.getElementById('admin-reports-content').innerHTML = html;
            });
        }

        function verifyPayment(iqamah, adminAction) {
            showLoader();
            fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action: 'verifyPaymentAdmin', iqamah, adminAction }) })
            .then(res => res.json())
            .then(res => { hideLoader(); alert(res.message); loadAdminData(); });
        }

        // KONSULTASI & CHAT DENGAN TERJEMAHAN 3 BAHASA REAL & UPLOAD FILE JPG/PDF
        function renderConsultation(container, data) {
            const partnerId = data.partnerId;
            const partnerName = data.partnerName;

            container.innerHTML = `
                <div class="max-w-4xl mx-auto px-4 py-8 w-full flex flex-col h-[82vh]">
                    <div class="bg-brand-navy text-white p-4 rounded-t-2xl flex justify-between items-center shadow">
                        <h3 class="font-bold">Konsultasi: ${partnerName}</h3>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-amber-300">Terjemahan Target:</span>
                            <select id="chatTargetLang" class="bg-slate-800 text-white text-xs rounded px-2 py-1 font-bold">
                                <option value="ar">Bahasa Arab 🇸🇦</option>
                                <option value="id">Bahasa Indonesia 🇮🇩</option>
                                <option value="en">English 🇬🇧</option>
                            </select>
                            <button onclick="switchView('${currentUser.role}Dashboard', currentUser)" class="text-xs bg-slate-700 px-3 py-1.5 rounded-lg ml-2">Kembali</button>
                        </div>
                    </div>
                    <div id="chat-box" class="flex-grow bg-white border-x border-slate-200 p-4 overflow-y-auto space-y-4 flex flex-col">
                        <p class="text-center text-xs text-slate-400">Pesan otomatis diterjemahkan secara real-time</p>
                    </div>
                    <div class="bg-slate-100 p-4 rounded-b-2xl border border-slate-200 flex gap-2 items-center">
                        <input type="file" id="chatFile" class="hidden" accept=".jpg,.jpeg,.png,.pdf" onchange="uploadChatFile(this, '${partnerId}')">
                        <button onclick="document.getElementById('chatFile').click()" class="bg-slate-200 hover:bg-slate-300 px-3 py-3 rounded-xl text-slate-700" title="Unggah JPG/PDF"><i class="fa-solid fa-paperclip"></i></button>
                        <input type="text" id="chatInput" placeholder="Ketik pesan konsultasi..." class="flex-grow bg-white border rounded-xl px-4 py-3 text-sm outline-none">
                        <button onclick="sendChatMessage('${partnerId}')" class="bg-brand-navy text-white px-6 py-3 rounded-xl font-bold">Kirim</button>
                    </div>
                </div>`;
            fetchMessages(partnerId);
        }

        function fetchMessages(partnerId) {
            fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action: 'getMessages', userIqamah: currentUser.iqamah, partnerIqamah: partnerId }) })
            .then(res => res.json())
            .then(res => {
                const box = document.getElementById('chat-box');
                if(!box) return;
                let html = `<p class="text-center text-xs text-slate-400">Riwayat Percakapan</p>`;
                if(res.chats) {
                    res.chats.forEach(c => {
                        let isMe = c.senderIqamah === currentUser.iqamah;
                        html += `<div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                            <div class="max-w-md p-3 rounded-xl text-sm ${isMe ? 'bg-brand-navy text-white' : 'bg-slate-200 text-slate-900'}">
                                <p>${c.message}</p>
                                <p class="text-xs opacity-75 mt-1 italic">Terjemahan (${c.targetLang.toUpperCase()}): ${c.translated}</p>
                                ${c.attachment ? `<a href="${c.attachment}" target="_blank" class="block text-xs underline mt-1 text-amber-300 font-semibold">Lihat File Lampiran (JPG/PDF)</a>` : ''}
                            </div>
                        </div>`;
                    });
                }
                box.innerHTML = html;
                box.scrollTop = box.scrollHeight;
            });
        }

        function sendChatMessage(partnerId) {
            const input = document.getElementById('chatInput');
            const targetLangSelect = document.getElementById('chatTargetLang');
            const msg = input.value.trim();
            if(!msg) return;

            showLoader();
            fetch(CONFIG.API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'sendMessage',
                    senderIqamah: currentUser.iqamah,
                    senderRole: currentUser.role,
                    receiverIqamah: partnerId,
                    message: msg,
                    sourceLang: currentLang,
                    targetLang: targetLangSelect ? targetLangSelect.value : 'ar',
                    attachmentLink: ''
                })
            }).then(() => {
                hideLoader();
                input.value = '';
                fetchMessages(partnerId);
            });
        }

        function uploadChatFile(input, partnerId) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            showLoader();
            reader.onload = function(e) {
                fetch(CONFIG.API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'uploadFile',
                        base64: e.target.result,
                        contentType: file.type,
                        folderName: 'Case Files',
                        fileName: file.name
                    })
                }).then(res => res.json()).then(res => {
                    hideLoader();
                    if(res.success) {
                        fetch(CONFIG.API_URL, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'sendMessage',
                                senderIqamah: currentUser.iqamah,
                                senderRole: currentUser.role,
                                receiverIqamah: partnerId,
                                message: '[Mengunggah Berkas: ' + file.name + ']',
                                sourceLang: currentLang,
                                targetLang: 'ar',
                                attachmentLink: res.fileLink
                            })
                        }).then(() => fetchMessages(partnerId));
                    }
                });
            };
            reader.readAsDataURL(file);
        }

        function openPaymentModal() {
            let receiptUrl = prompt("Masukkan Link Bukti Transfer Pembayaran 99 SAR (Google Drive / Gambar):");
            if(!receiptUrl) return;
            showLoader();
            fetch(CONFIG.API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'submitPayment',
                    iqamah: currentUser.iqamah,
                    name: currentUser.name,
                    receiptLink: receiptUrl
                })
            }).then(res => res.json()).then(res => { hideLoader(); alert(res.message); });
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const role = document.getElementById('loginRole').value;
            const iqamah = document.getElementById('loginIqamah').value;
            const password = document.getElementById('loginPassword').value;

            showLoader();
            fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', role, iqamah, password }) })
            .then(res => res.json())
            .then(res => {
                hideLoader();
                if(res.success) {
                    if(res.role === 'worker') switchView('workerDashboard', res);
                    else if(res.role === 'lawyer') switchView('lawyerDashboard', res);
                    else if(res.role === 'admin') switchView('adminDashboard', res);
                } else { alert(res.message); }
            });
        }

        function handleRegisterSubmit(e) {
            e.preventDefault();
            const role = document.getElementById('regRole').value;
            const data = {
                action: 'register',
                role: role,
                name: document.getElementById('regName').value,
                iqamah: document.getElementById('regIqamah').value,
                email: document.getElementById('regEmail').value,
                phone: document.getElementById('regPhone').value,
                password: document.getElementById('regPassword').value,
                workplace: role === 'worker' ? document.getElementById('regExtra').value : '',
                license: role === 'lawyer' ? document.getElementById('regExtra').value : ''
            };

            showLoader();
            fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(data) })
            .then(res => res.json())
            .then(res => {
                hideLoader();
                alert(res.message);
                if(res.success) switchView('login');
            });
        }

        document.addEventListener('DOMContentLoaded', () => switchView('landing'));
    </script>
</body>
</html>
